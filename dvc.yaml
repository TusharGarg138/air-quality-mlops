stages:
  validate_data:
    cmd: python -m src.data.validate
    deps:
      - data/raw/air_quality_raw.csv
      - src/data/validate.py
      - configs/params.yaml
    outs:
      - reports/data_validation_report.json

  preprocess:
    cmd: python -m src.features.preprocess
    deps:
      - data/raw/air_quality_raw.csv
      - src/features/preprocess.py
      - configs/params.yaml
    outs:
      - data/processed/train.parquet
      - data/processed/val.parquet
      - data/processed/test.parquet
      - models/preprocessor.pkl

  train:
    cmd: python -m src.training.train
    deps:
      - data/processed/train.parquet
      - data/processed/val.parquet
      - src/training/train.py
      - configs/params.yaml
    outs:
      - models/best_model.pkl
      - models/model_metadata.json

  evaluate:
    cmd: python -m src.training.evaluate
    deps:
      - data/processed/test.parquet
      - models/best_model.pkl
      - models/preprocessor.pkl
      - src/training/evaluate.py
      - configs/params.yaml
    metrics:
      - reports/model_metrics.json:
          cache: false
    plots:
      - reports/figures/actual_vs_predicted.png:
          cache: false
      - reports/figures/residuals.png:
          cache: false